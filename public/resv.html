<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt bàn — Billiard Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11161d; --panel:#1a212b; --panel2:#212a36; --line:#2b3542;
    --copper:#cf7a3a; --copper2:#e69a5c; --text:#eef1f5; --muted:#8d97a6;
    --good:#3fbf74; --warn:#e0a53e; --bad:#e0523e;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Be Vietnam Pro',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  header{display:flex; align-items:center; gap:24px; padding:14px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#141b23,#11161d); position:sticky; top:env(safe-area-inset-top,0px); z-index:10; flex-wrap:wrap;}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px;}
  .logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--copper),var(--copper2));display:flex;align-items:center;justify-content:center;font-size:15px;}
  nav{display:flex; gap:4px; flex:1; flex-wrap:wrap;}
  nav a{color:var(--muted); font-family:inherit; font-size:14.5px; font-weight:600; padding:9px 14px; border-radius:8px; cursor:pointer; text-decoration:none;}
  nav a.active{color:var(--text); background:var(--panel2);}
  .clock{text-align:right; color:var(--muted); font-size:12.5px; line-height:1.4;}
  .userbox{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px;}
  .userbox b{color:var(--text);}
  .userbox button{background:var(--panel2); border:1px solid var(--line); color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600; padding:7px 11px; border-radius:8px; cursor:pointer;}
  main{padding:20px; max-width:1200px; margin:0 auto;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
  .section-title{font-size:15px; font-weight:700; margin:0;}
  .btn{background:var(--copper); color:#1a1208; border:none; border-radius:9px; padding:10px 16px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;}
  .btn.ghost{background:var(--panel2); color:var(--text); border:1px solid var(--line);}
  .btn.small{padding:6px 10px; font-size:12.5px; border-radius:7px;}
  .btn.danger{background:var(--bad); color:#fff;}
  input,select{background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13.5px;}
  label{font-size:12.5px; color:var(--muted); font-weight:600; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;}
  .resv-row{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:10px; gap:10px; flex-wrap:wrap;}
  .resv-row .who{font-weight:700;}
  .resv-row .meta{color:var(--muted); font-size:13px; margin-top:2px;}
  .tag{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .tag.ok{background:rgba(63,191,116,.15); color:var(--good);}
  .tag.soon{background:rgba(224,165,62,.15); color:var(--warn);}
  .tag.over{background:rgba(224,82,62,.15); color:var(--bad);}
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--muted); gap:10px; text-align:center;}
  .empty-state .ic{font-size:36px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--bad); color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:100; display:none;}
  @media (max-width:720px){ .clock{display:none;} }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark">☕</div> Billiard Coffee</div>
  <nav>
    <a href="/tables.html">Sơ đồ bàn</a>
    <a class="active" href="/resv.html">Đặt bàn</a>
    <a href="/manage.html">Quản lý</a>
  </nav>
  <div class="clock" id="clock"></div>
  <div class="userbox"><span>Xin chào, <b id="whoami">…</b></span><button onclick="logout()">Đăng xuất</button></div>
</header>

<main>
  <div class="topbar">
    <p class="section-title">Đặt bàn trước</p>
    <button class="btn" onclick="openResvForm()">+ Tạo đơn đặt bàn</button>
  </div>
  <div id="resvForm" style="display:none;" class="card"></div>
  <div id="resvList"></div>
</main>

<div class="toast" id="toast"></div>

<script>
async function api(path, opts={}){
  const res = await fetch(path.startsWith('/api')?path:'/api'+path, {
    headers:{'Content-Type':'application/json'}, credentials:'same-origin', ...opts
  });
  if(res.status===401){ location.href='/login.html'; throw new Error('Chưa đăng nhập'); }
  let data=null; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data&&data.error)||'Có lỗi xảy ra.');
  return data;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none', 2500);
}
function logout(){ api('/logout',{method:'POST'}).finally(()=>location.href='/login.html'); }

let reservations=[], tableList=[]; // tableList chỉ để hiển thị dropdown "giữ bàn số", thuộc trang Sơ đồ bàn

function tickClock(){
  const now=new Date();
  document.getElementById('clock').innerHTML = now.toLocaleTimeString('vi-VN',{hour12:false})+'<br>'+now.toLocaleDateString('vi-VN');
}

async function init(){
  const { user } = await api('/session');
  if(!user){ location.href='/login.html'; return; }
  document.getElementById('whoami').textContent = user.full_name || user.username;
  [reservations, tableList] = await Promise.all([ api('/reservations'), api('/tables') ]);
  renderReservations();
  tickClock(); setInterval(tickClock,1000);
  setInterval(async ()=>{ try{ reservations = await api('/reservations'); renderReservations(); }catch(e){} }, 15000);
}

function openResvForm(){
  const f=document.getElementById('resvForm');
  f.style.display='block';
  f.innerHTML=`
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="field"><label>Tên khách</label><input id="rName" style="width:100%;"></div>
      <div class="field"><label>Số điện thoại</label><input id="rPhone" style="width:100%;"></div>
      <div class="field"><label>Giờ khách đến</label><input id="rTime" type="datetime-local" style="width:100%;"></div>
      <div class="field"><label>Số khách</label><input id="rGuests" type="number" min="1" value="2" style="width:100%;"></div>
      <div class="field"><label>Giữ bàn số (tuỳ chọn)</label>
        <select id="rTable" style="width:100%;"><option value="">Không chọn trước</option>${tableList.map(t=>'<option value="'+t.id+'">Bàn '+t.id+'</option>').join('')}</select>
      </div>
      <div class="field"><label>Ghi chú</label><input id="rNote" style="width:100%;"></div>
    </div>
    <button class="btn" onclick="saveReservation()">Lưu đặt bàn</button>
    <button class="btn ghost" onclick="document.getElementById('resvForm').style.display='none'">Huỷ</button>`;
}
async function saveReservation(){
  const name=document.getElementById('rName').value.trim();
  const time=document.getElementById('rTime').value;
  if(!name||!time){ toast('Nhập tên khách và giờ đến.'); return; }
  try{
    await api('/reservations',{method:'POST',body:JSON.stringify({
      name, phone:document.getElementById('rPhone').value,
      reserve_time:time, guests:parseInt(document.getElementById('rGuests').value)||1,
      note:document.getElementById('rNote').value,
      table_id: document.getElementById('rTable').value ? parseInt(document.getElementById('rTable').value) : null
    })});
    document.getElementById('resvForm').style.display='none';
    reservations = await api('/reservations');
    renderReservations();
  }catch(e){ toast(e.message); }
}
function renderReservations(){
  const list=document.getElementById('resvList');
  if(reservations.length===0){
    list.innerHTML='<div class="empty-state"><div class="ic">📋</div><div style="font-weight:700; color:var(--text);">Chưa có thông tin đặt bàn</div><div>Thêm thông tin đặt bàn để chuẩn bị sẵn sàng phục vụ khách hàng</div></div>';
    return;
  }
  const sorted=[...reservations].sort((a,b)=>new Date(a.reserve_time)-new Date(b.reserve_time));
  list.innerHTML=sorted.map(r=>{
    const diff=new Date(r.reserve_time).getTime()-Date.now();
    let tag = diff<0 ? '<span class="tag over">Quá giờ</span>' : diff<=30*60000 ? '<span class="tag soon">Sắp đến</span>' : '<span class="tag ok">Đã đặt</span>';
    const d=new Date(r.reserve_time);
    return '<div class="resv-row"><div><div class="who">'+r.name+' · '+r.guests+' khách'+(r.table_id?' · Bàn '+r.table_id:'')+'</div>'+
      '<div class="meta">'+d.toLocaleString('vi-VN')+(r.phone?' · '+r.phone:'')+(r.note?' · '+r.note:'')+'</div></div>'+
      '<div style="display:flex; gap:8px; align-items:center;">'+tag+'<button class="btn small danger" onclick="removeRes('+r.id+')">Xoá</button></div></div>';
  }).join('');
}
async function removeRes(id){
  try{ await api('/reservations/'+id,{method:'DELETE'}); reservations=reservations.filter(r=>r.id!==id); renderReservations(); }
  catch(e){ toast(e.message); }
}

init();
</script>
</body>
</html>
