<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đăng nhập — Billiard Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11161d; --panel:#1a212b; --panel2:#212a36; --line:#2b3542;
    --copper:#cf7a3a; --copper2:#e69a5c; --text:#eef1f5; --muted:#8d97a6; --bad:#e0523e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Be Vietnam Pro',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .box{width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px;}
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; margin-bottom:4px;}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--copper),var(--copper2));display:flex;align-items:center;justify-content:center;font-size:16px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:22px;}
  label{font-size:12.5px; color:var(--muted); font-weight:600; display:block; margin-bottom:5px;}
  .field{margin-bottom:14px;}
  input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:11px 12px; font-family:inherit; font-size:14.5px;}
  .btn{width:100%; background:var(--copper); color:#1a1208; border:none; border-radius:9px; padding:12px 16px; font-family:inherit; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:4px;}
  .btn:disabled{opacity:.6; cursor:default;}
  .err{background:rgba(224,82,62,.13); border:1px solid rgba(224,82,62,.4); color:var(--bad); padding:10px 12px; border-radius:9px; font-size:13px; font-weight:600; margin-bottom:14px; display:none;}
  .note{color:var(--muted); font-size:12px; margin-top:18px; text-align:center; line-height:1.5;}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><div class="logo-mark">☕</div> Billiard Coffee</div>
    <div class="sub">Đăng nhập để quản lý quán</div>
    <div class="err" id="err"></div>
    <form id="loginForm">
      <div class="field"><label>Tài khoản</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="submitBtn" type="submit">Đăng nhập</button>
    </form>
    <div class="note">Không có trang đăng ký.<br>Tài khoản chỉ được chủ quán cấp trực tiếp qua hệ thống SQL.</div>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn'), errBox=document.getElementById('err');
  errBox.style.display='none';
  btn.disabled=true; btn.textContent='Đang đăng nhập...';
  try{
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Đăng nhập thất bại.');
    location.href = '/tables.html';
  }catch(err){
    errBox.textContent = err.message;
    errBox.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent='Đăng nhập';
  }
});
fetch('/api/session').then(r=>r.json()).then(d=>{ if(d.user) location.href='/tables.html'; });
</script>
</body>
</html>
